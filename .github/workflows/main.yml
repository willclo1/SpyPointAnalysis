name: Pull SPYPOINT photos to Google Drive

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Reprocess every existing image from Google Drive
        required: false
        default: false
        type: boolean

# Prevent two runs from reading and replacing events.csv simultaneously.
concurrency:
  group: spypoint-photo-pipeline
  cancel-in-progress: false

# This workflow only needs permission to read the repository.
permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_ONLY_BINARY: "onnx,blake3"
  IMAGE_DIRECTORY: "images"
  EVENTS_CSV: "events.csv"
  EVENTS_TSV: "events.tsv"
  EVENTS_JSON: "docs/events.json"

jobs:
  pull:
    name: Download and analyze SPYPOINT photos
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            protobuf-compiler \
            libprotobuf-dev \
            pkg-config \
            libavif-dev \
            libaom-dev

          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade \
            "pip<26" \
            "setuptools==80.9.0" \
            wheel

          python -m pip install \
            --only-binary=:all: \
            "onnx==1.16.2" \
            "protobuf<5" \
            "blake3==1.0.8" \
            "asn1crypto==1.5.1"

          python -m pip install -r requirements.txt

      - name: Verify Python environment
        run: |
          python - <<'PY'
          import pkg_resources
          import cv2
          import numpy
          import pandas
          import PIL
          import speciesnet

          print("Python dependency verification passed")
          PY

      - name: Install rclone
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            https://rclone.org/install.sh \
            --output /tmp/install-rclone.sh

          sudo bash /tmp/install-rclone.sh
          rm -f /tmp/install-rclone.sh

          rclone version

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [[ -z "$RCLONE_CONF" ]]; then
            echo "::error::The RCLONE_CONF repository secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"

          printf '%s' "$RCLONE_CONF" \
            > "$HOME/.config/rclone/rclone.conf"

          chmod 600 "$HOME/.config/rclone/rclone.conf"

          rclone listremotes | grep --quiet '^gdrive:$' || {
            echo "::error::The rclone configuration does not contain a gdrive remote."
            exit 1
          }

      - name: Validate required secrets
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GCP_VISION_KEY_JSON: ${{ secrets.GCP_VISION_KEY_JSON }}
          SPYPOINT_EMAIL: ${{ secrets.SPYPOINT_EMAIL }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
          FULL_REBUILD: ${{ inputs.full_rebuild || false }}
        run: |
          missing=0

          require_secret() {
            local name="$1"
            local value="$2"

            if [[ -z "$value" ]]; then
              echo "::error::Required secret $name is missing."
              missing=1
            fi
          }

          require_secret "GDRIVE_FOLDER_ID" "$GDRIVE_FOLDER_ID"
          require_secret "GCP_VISION_KEY_JSON" "$GCP_VISION_KEY_JSON"

          if [[ "$FULL_REBUILD" != "true" ]]; then
            require_secret "SPYPOINT_EMAIL" "$SPYPOINT_EMAIL"
            require_secret "SPYPOINT_PASSWORD" "$SPYPOINT_PASSWORD"
          fi

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Prepare workspace
        run: |
          mkdir -p "$IMAGE_DIRECTORY" docs
          rm -f "$EVENTS_CSV" "$EVENTS_TSV" "$EVENTS_JSON"

      - name: Download new SPYPOINT photos
        if: github.event_name == 'schedule' || inputs.full_rebuild != true
        env:
          SPYPOINT_EMAIL: ${{ secrets.SPYPOINT_EMAIL }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python download.py

      - name: Download all existing images for full rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.full_rebuild == true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy \
            "gdrive:" \
            "$IMAGE_DIRECTORY" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --include "**.jpg" \
            --include "**.jpeg" \
            --include "**.JPG" \
            --include "**.JPEG" \
            --transfers 8 \
            --checkers 16 \
            --retries 5 \
            --low-level-retries 10 \
            --stats 30s \
            --stats-one-line \
            --verbose

      - name: Download existing event data
        if: github.event_name == 'schedule' || inputs.full_rebuild != true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          if rclone lsf \
            "gdrive:events.csv" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --files-only |
            grep --quiet '^events\.csv$'; then

            rclone copyto \
              "gdrive:events.csv" \
              "$EVENTS_CSV" \
              --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
              --retries 5 \
              --low-level-retries 10 \
              --verbose
          else
            echo "No existing events.csv was found. A new file will be created."
          fi

      - name: Write Google Vision credentials
        env:
          GCP_VISION_KEY_JSON: ${{ secrets.GCP_VISION_KEY_JSON }}
        run: |
          CREDENTIAL_FILE="$RUNNER_TEMP/gcp-vision-key.json"

          printf '%s' "$GCP_VISION_KEY_JSON" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"

          python -m json.tool "$CREDENTIAL_FILE" > /dev/null

          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" \
            >> "$GITHUB_ENV"

      - name: Count input images
        id: image-count
        run: |
          image_count="$(
            find "$IMAGE_DIRECTORY" \
              -type f \
              \( \
                -iname '*.jpg' \
                -o -iname '*.jpeg' \
                -o -iname '*.png' \
              \) |
            wc -l |
            tr -d ' '
          )"

          echo "count=$image_count" >> "$GITHUB_OUTPUT"
          echo "Found $image_count image(s) to inspect."

      - name: Run SpeciesNet and OCR
        if: steps.image-count.outputs.count != '0'
        env:
          SPECIESNET_COUNTRY: "USA"
          SPECIESNET_ADMIN1: "TX"
          FULL_REBUILD: ${{ inputs.full_rebuild == true && '1' || '0' }}
          REUSE_SPECIESNET: ${{ inputs.full_rebuild == true && '0' || '1' }}
        run: |
          python run_events_append.py

      - name: Handle run with no local images
        if: steps.image-count.outputs.count == '0'
        run: |
          if [[ -f "$EVENTS_CSV" ]]; then
            echo "No new images were downloaded. Keeping the existing event data."
          else
            echo "::error::No images and no existing events.csv were available."
            exit 1
          fi

      - name: Validate event CSV
        run: |
          if [[ ! -s "$EVENTS_CSV" ]]; then
            echo "::error::$EVENTS_CSV was not created or is empty."
            exit 1
          fi

          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("events.csv")

          with path.open("r", encoding="utf-8-sig", newline="") as file:
              reader = csv.DictReader(file)
              headers = reader.fieldnames or []

          required = {"filename", "date", "time"}

          missing = required.difference(headers)
          if missing:
              raise SystemExit(
                  f"events.csv is missing required columns: {sorted(missing)}"
              )

          print(f"events.csv validation passed with {len(headers)} columns")
          PY

      - name: Build website event JSON
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python build_events_json.py

      - name: Validate generated outputs
        run: |
          test -s "$EVENTS_CSV" || {
            echo "::error::$EVENTS_CSV is missing or empty."
            exit 1
          }

          test -s "$EVENTS_JSON" || {
            echo "::error::$EVENTS_JSON is missing or empty."
            exit 1
          }

          python -m json.tool "$EVENTS_JSON" > /dev/null

          if [[ -f "$EVENTS_TSV" ]]; then
            test -s "$EVENTS_TSV" || {
              echo "::error::$EVENTS_TSV exists but is empty."
              exit 1
            }
          else
            echo "::warning::$EVENTS_TSV was not produced."
          fi

      - name: Upload new images to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy \
            "$IMAGE_DIRECTORY" \
            "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --ignore-existing \
            --transfers 8 \
            --checkers 16 \
            --retries 5 \
            --low-level-retries 10 \
            --stats 30s \
            --stats-one-line \
            --verbose

      - name: Upload event data to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copyto \
            "$EVENTS_JSON" \
            "gdrive:events.json" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --retries 5 \
            --low-level-retries 10 \
            --verbose

          rclone copyto \
            "$EVENTS_CSV" \
            "gdrive:events.csv" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --retries 5 \
            --low-level-retries 10 \
            --verbose

          if [[ -s "$EVENTS_TSV" ]]; then
            rclone copyto \
              "$EVENTS_TSV" \
              "gdrive:events.tsv" \
              --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
              --retries 5 \
              --low-level-retries 10 \
              --verbose
          fi

      - name: Save pipeline outputs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spypoint-pipeline-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            events.csv
            events.tsv
            docs/events.json
