name: Pull SPYPOINT photos to Google Drive

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "America/Chicago"

  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Reprocess every existing image from Google Drive
        required: false
        default: false
        type: boolean

      backfill_start:
        description: Optional backfill start date (YYYY-MM-DD)
        required: false
        default: ""
        type: string

      backfill_end:
        description: Optional backfill end date (YYYY-MM-DD)
        required: false
        default: ""
        type: string

concurrency:
  group: spypoint-photo-pipeline
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_ONLY_BINARY: "onnx,blake3"
  IMAGE_DIRECTORY: "images"
  EVENTS_CSV: "events.csv"
  EVENTS_TSV: "events.tsv"
  EVENTS_JSON: "docs/events.json"
  PROCESSING_MANIFEST: "processing-manifest.json"
  PIPELINE_CONFIG: "pipeline_config.json"

jobs:
  pull:
    name: Download and analyze SPYPOINT photos
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            protobuf-compiler libprotobuf-dev pkg-config \
            libavif-dev libaom-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade "pip<26" "setuptools==80.9.0" wheel

          python -m pip install --only-binary=:all: \
            "onnx==1.16.2" \
            "protobuf<5" \
            "blake3==1.0.8" \
            "asn1crypto==1.5.1"

          python -m pip install -r requirements.txt

          # requirements.txt may contain an old SpeciesNet package.
          # Force the current complete release after all other dependencies.
          python -m pip uninstall --yes speciesnet
          python -m pip install --no-cache-dir --upgrade \
            "speciesnet==5.0.5"

      - name: Verify Python environment
        run: |
          python --version
          python -m pip show speciesnet

          python - <<'PY'
          import importlib.util
          import pathlib

          import cv2
          import numpy
          import pandas
          import PIL
          import speciesnet
          import google.cloud.vision
          import astral

          module = importlib.util.find_spec("speciesnet.scripts.run_model")

          print("SpeciesNet package:", speciesnet.__file__)
          print("SpeciesNet version module path:", pathlib.Path(speciesnet.__file__).parent)

          if module is None:
              raise RuntimeError(
                  "speciesnet.scripts.run_model is missing from the installed package"
              )

          print("SpeciesNet run_model:", module.origin)
          print("Python dependency verification passed")
          PY


      - name: Install rclone
        run: |
          curl --fail --silent --show-error --location \
            https://rclone.org/install.sh --output /tmp/install-rclone.sh
          sudo bash /tmp/install-rclone.sh
          rm -f /tmp/install-rclone.sh
          rclone version

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          test -n "$RCLONE_CONF" || { echo "::error::RCLONE_CONF is missing"; exit 1; }
          mkdir -p "$HOME/.config/rclone"
          chmod 700 "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONF" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes | grep --quiet '^gdrive:$' || {
            echo "::error::The rclone configuration has no gdrive remote."
            exit 1
          }

      - name: Validate inputs and secrets
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GCP_VISION_KEY_JSON: ${{ secrets.GCP_VISION_KEY_JSON }}
          SPYPOINT_EMAIL: ${{ secrets.SPYPOINT_EMAIL }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
          FULL_REBUILD: ${{ inputs.full_rebuild || false }}
          BACKFILL_START: ${{ inputs.backfill_start || '' }}
          BACKFILL_END: ${{ inputs.backfill_end || '' }}
        run: |
          test -n "$GDRIVE_FOLDER_ID" || { echo "::error::GDRIVE_FOLDER_ID is missing"; exit 1; }
          test -n "$GCP_VISION_KEY_JSON" || { echo "::error::GCP_VISION_KEY_JSON is missing"; exit 1; }

          if [[ "$FULL_REBUILD" != "true" ]]; then
            test -n "$SPYPOINT_EMAIL" || { echo "::error::SPYPOINT_EMAIL is missing"; exit 1; }
            test -n "$SPYPOINT_PASSWORD" || { echo "::error::SPYPOINT_PASSWORD is missing"; exit 1; }
          fi

          if [[ -n "$BACKFILL_START" || -n "$BACKFILL_END" ]]; then
            test -n "$BACKFILL_START" || { echo "::error::Both backfill dates are required"; exit 1; }
            test -n "$BACKFILL_END" || { echo "::error::Both backfill dates are required"; exit 1; }
            date -d "$BACKFILL_START" +%F >/dev/null
            date -d "$BACKFILL_END" +%F >/dev/null
            if [[ "$BACKFILL_START" > "$BACKFILL_END" ]]; then
              echo "::error::backfill_start cannot be after backfill_end"
              exit 1
            fi
          fi

      - name: Validate repository files
        run: |
          for file in requirements.txt download.py run_events_append.py \
            build_events_json.py config.py processing_manifest.py pipeline_config.json; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          python -m json.tool pipeline_config.json >/dev/null

      - name: Prepare workspace
        run: |
          mkdir -p "$IMAGE_DIRECTORY" docs
          rm -f "$EVENTS_CSV" "$EVENTS_TSV" "$EVENTS_JSON" "$PROCESSING_MANIFEST"

      - name: Download existing pipeline state
        if: inputs.full_rebuild != true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copyto "gdrive:events.csv" "$EVENTS_CSV" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" -v || true
          rclone copyto "gdrive:processing-manifest.json" "$PROCESSING_MANIFEST" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" -v || true

      - name: Download new or backfill SPYPOINT photos
        if: inputs.full_rebuild != true
        env:
          SPYPOINT_EMAIL: ${{ secrets.SPYPOINT_EMAIL }}
          SPYPOINT_PASSWORD: ${{ secrets.SPYPOINT_PASSWORD }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          START_DATE: ${{ inputs.backfill_start || '' }}
          END_DATE: ${{ inputs.backfill_end || '' }}
          FULL_REDOWNLOAD: ${{ (inputs.backfill_start != '' && inputs.backfill_end != '') && '1' || '0' }}
          POLL_LIMIT: ${{ (inputs.backfill_start != '' && inputs.backfill_end != '') && '5000' || '250' }}
          MAX_NEW_PER_RUN: ${{ (inputs.backfill_start != '' && inputs.backfill_end != '') && '5000' || '400' }}
          LOCAL_TZ: "America/Chicago"
        run: python download.py

      - name: Download all existing images for full rebuild
        if: inputs.full_rebuild == true
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy "gdrive:" "$IMAGE_DIRECTORY" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --include "**.jpg" --include "**.jpeg" --include "**.png" \
            --include "**.JPG" --include "**.JPEG" --include "**.PNG" \
            --transfers 8 --checkers 16 --retries 5 --low-level-retries 10 \
            --stats 30s --stats-one-line -v

      - name: Write Google Vision credentials
        env:
          GCP_VISION_KEY_JSON: ${{ secrets.GCP_VISION_KEY_JSON }}
        run: |
          CREDENTIAL_FILE="$RUNNER_TEMP/gcp-vision-key.json"
          printf '%s' "$GCP_VISION_KEY_JSON" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"
          python -m json.tool "$CREDENTIAL_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" >> "$GITHUB_ENV"

      - name: Count input images
        id: image-count
        run: |
          count=$(find "$IMAGE_DIRECTORY" -type f \
            \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Found $count image(s)."

      - name: Run SpeciesNet and OCR
        if: steps.image-count.outputs.count != '0'
        env:
          SPECIESNET_COUNTRY: "USA"
          SPECIESNET_ADMIN1: "TX"
          FULL_REBUILD: ${{ inputs.full_rebuild == true && '1' || '0' }}
          UPDATE_EXISTING: ${{ (inputs.backfill_start != '' && inputs.backfill_end != '') && '1' || '0' }}
          REUSE_SPECIESNET: ${{ inputs.full_rebuild == true && '0' || '1' }}
          PROCESSING_MANIFEST: ${{ env.PROCESSING_MANIFEST }}
          PIPELINE_CONFIG: ${{ env.PIPELINE_CONFIG }}
        run: python run_events_append.py

      - name: Handle no local images
        if: steps.image-count.outputs.count == '0'
        run: |
          test -s "$EVENTS_CSV" || {
            echo "::error::No local images and no existing events.csv were available."
            exit 1
          }
          echo "No images required processing; retaining current event data."

      - name: Build website event JSON
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          PIPELINE_CONFIG: ${{ env.PIPELINE_CONFIG }}
        run: python build_events_json.py

      - name: Validate outputs
        run: |
          test -s "$EVENTS_CSV" || { echo "::error::events.csv is missing"; exit 1; }
          test -s "$EVENTS_JSON" || { echo "::error::docs/events.json is missing"; exit 1; }
          python -m json.tool "$EVENTS_JSON" >/dev/null
          if [[ "${{ steps.image-count.outputs.count }}" != "0" ]]; then
            test -s "$PROCESSING_MANIFEST" || {
              echo "::error::processing-manifest.json is missing"
              exit 1
            }
          fi

      - name: Upload images
        if: steps.image-count.outputs.count != '0'
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copy "$IMAGE_DIRECTORY" "gdrive:" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" --ignore-existing \
            --transfers 8 --checkers 16 --retries 5 --low-level-retries 10 \
            --stats 30s --stats-one-line -v

      - name: Upload event data and pipeline state
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          rclone copyto "$EVENTS_JSON" "gdrive:events.json" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" --retries 5 --low-level-retries 10 -v
          rclone copyto "$EVENTS_CSV" "gdrive:events.csv" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" --retries 5 --low-level-retries 10 -v
          rclone copyto "$PROCESSING_MANIFEST" "gdrive:processing-manifest.json" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" --retries 5 --low-level-retries 10 -v
          if [[ -s "$EVENTS_TSV" ]]; then
            rclone copyto "$EVENTS_TSV" "gdrive:events.tsv" \
              --drive-root-folder-id "$GDRIVE_FOLDER_ID" --retries 5 --low-level-retries 10 -v
          fi

      - name: Save pipeline outputs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spypoint-pipeline-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            events.csv
            events.tsv
            processing-manifest.json
            pipeline_config.json
            docs/events.json
